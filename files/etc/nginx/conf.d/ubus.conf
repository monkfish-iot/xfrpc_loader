server {
    listen 8765;
    server_name localhost;
    client_max_body_size 64m;
    location / {
        #auth_request /;
        #auth_request_set $auth_user $upstream_http_x_forwarded_user;
        #auth_request_set $auth_email $upstream_http_x_forwarded_email;
        #proxy_set_header X-Forwarded-User $auth_user;
        #proxy_set_header X-Forwarded-Email $auth_email;

        proxy_pass http://127.0.0.1:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
    }

    # 禁止直接经本虚拟主机调用 LuCI RPC 登录接口
    # 说明：此 nginx 精简版无 ngx_http_rewrite_module，不能用 return 404，
    #       改用核心自带 try_files 的 =404 兜底返回 404。
    location = /cgi-bin/luci/rpc/auth {
        try_files /nonexistent =404;
    }

    # 禁止直接经本虚拟主机调用 LuCI RPC 修改密码接口（uci?auth= 前缀）
    location ^~ /cgi-bin/luci/rpc/uci {
        try_files /nonexistent =404;
    }

    location = /auth {
        # 转发到认证服务
        proxy_pass http://127.0.0.1:8888/auth;
        # 重要：如果认证接口需要 POST 请求
       # proxy_method POST;
        proxy_redirect default;
        # 传递认证头信息
        proxy_set_header Content-Type "application/json";
        proxy_set_header X-Original-URI $request_uri;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 传递客户端的认证信息（如果有）
 }

}